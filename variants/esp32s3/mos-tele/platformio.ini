[env:mos-tele]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = MOS_TELE
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 2
custom_meshtastic_display_name = MOS-TELE
custom_meshtastic_tags = DIY
custom_meshtastic_requires_dfu = false
custom_meshtastic_partition_scheme = 16MB

extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = extra
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = dio_opi

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D MOS_TELE
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/mos-tele
